version: 2
updates:
  # JS/TS dependencies across the pnpm workspace.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev tooling bumps into a single PR to cut noise.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions used in workflows current (security patches).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
