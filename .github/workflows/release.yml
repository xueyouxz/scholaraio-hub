name: Release

on:
  push:
    branches: [main]

# Don't cancel an in-flight publish; let releases complete.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version PR, create tags + GitHub Releases
      pull-requests: write # open/update the "version packages" PR
      id-token: write # npm provenance (OIDC)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog generation needs full history
      - uses: ./.github/actions/setup
      # Quality gate: never publish an unverified tree.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Either opens/updates the version PR, or (once that PR is merged and
      # versions are pending) builds and publishes to npm + creates GitHub
      # Releases. `published`/`publishedPackages` outputs drive the docker job.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  docker:
    needs: release
    # Only build + push the image when an actual npm publish happened.
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read server version
        id: ver
        run: echo "version=$(node -p "require('./packages/server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` is safe here: this job only runs on a published stable
          # release off main (no pre-releases in this flow).
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
