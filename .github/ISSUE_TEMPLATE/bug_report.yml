name: Bug Report
description: Report a problem with scholaraio-hub
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably reproduce the issue.
      placeholder: |
        1. Start hub with `pnpm dev`
        2. Navigate to /library
        3. Click on a paper
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or screenshots if relevant.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Production (pnpm build + pnpm start)
        - Development (pnpm dev)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.4, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`
      placeholder: "e.g. v22.3.0"

  - type: input
    id: hub-version
    attributes:
      label: scholaraio-hub commit
      description: Run `git rev-parse --short HEAD` in your checkout
      placeholder: "e.g. 8f27a33"

  - type: textarea
    id: doctor
    attributes:
      label: Environment check
      description: Output of `pnpm hub doctor` (add `--production` for a production install)
      render: text
