name: Release

on:
  push:
    branches: [main]

# Don't cancel an in-flight release; let the image push complete.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Quality gate: never ship an image from an unverified tree.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Read server version
        id: ver
        run: echo "version=$(node -p "require('./packages/server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Plain docker build/push (daemon BuildKit) — avoids the buildx
      # docker-container driver, which is flaky pulling moby/buildkit on runners.
      - name: Build and push image
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build \
            -t "$image:latest" \
            -t "$image:${{ steps.ver.outputs.version }}" \
            -t "$image:sha-$(git rev-parse --short HEAD)" \
            .
          docker push --all-tags "$image"
