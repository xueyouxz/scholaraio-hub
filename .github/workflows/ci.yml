name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so pushes don't pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
      # Second e2e layer (server contract / Vitest), per CLAUDE.md.
      - run: pnpm --filter @scholaraio-hub/server test:e2e

  e2e:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key on the lockfile (which pins the Playwright version) so the cache
          # invalidates exactly when the browser version can change.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      # `pnpm test:e2e` builds the client itself, so no separate build step.
      - run: pnpm test:e2e

  audit:
    runs-on: ubuntu-latest
    # Non-blocking for now: surfaces prod vuln advisories without gating PRs.
    # Flip to a hard failure once the baseline is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit:prod

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (push: false) to validate the Dockerfile on every PR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
